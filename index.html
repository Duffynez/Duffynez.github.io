<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video přehrávač</title>
    <style>
        /* Nastavení celé stránky */
        body {
            background-color: #000000; /* Černé pozadí */
            margin: 0;
            height: 100vh; /* Výška přes celou obrazovku */
            display: flex; /* Zapne "pružný" layout pro centrování */
            justify-content: center; /* Vycentruje vodorovně */
            align-items: center; /* Vycentruje svisle */
            overflow: hidden; /* Schová posuvníky, kdyby video bylo moc velké */
        }

        /* Nastavení vzhledu videa */
        video {
            max-width: 90%; /* Aby nebylo širší než obrazovka */
            max-height: 90vh; /* Aby nebylo vyšší než obrazovka */
            
            /* RÁMEČEK */
            border: 4px solid #333; /* Tmavě šedý rámeček, tloušťka 4px */
            border-radius: 12px; /* Zaoblené rohy rámečku */
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1); /* Jemná záře kolem */
            outline: none;
        }
    </style>
</head>
<body>

    <video controls autoplay muted>
        <source src="dancing_duck.mp4" type="video/mp4">
        Váš prohlížeč nepodporuje přehrávání videa.
    </video>

</body>
</html>
